services:
  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - API_PORT=3000
      - DB_URI=mongodb://db:27017/database
    depends_on:
      - db
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
